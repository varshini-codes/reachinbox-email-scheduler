
services:
  redis:
    image: redis:7-alpine
    container_name: scheduler-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    external: true
    name: 0bb1593852685367869801bcacdda790b8537ce1edebbbe4218d176fb5734462
